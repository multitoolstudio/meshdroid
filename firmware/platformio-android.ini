; ---------------------------------------------------------------------------
; meshtasticd for Android: arm64-v8a, bionic, no root.
;
; build-meshtasticd-android.sh copies this file to
; variants/native/portduino-android/platformio.ini in the firmware checkout,
; where the top-level extra_configs glob picks it up. The "buildroot" board
; makes platform-native take the compiler, linker and archiver from the
; TARGET_* environment variables, which the script points at the NDK.
;
; Modelled on [env:native-macos]: headless, with no BlueZ, libgpiod or Linux
; I2C device access. PORTDUINO_LINUX_HARDWARE is deliberately left undefined.
; The CH341 is driven by libch341-spi-userspace over libusb, with the usbfs
; descriptor supplied by the app (patch 0001).
; ---------------------------------------------------------------------------
[env:android-arm64]
extends = portduino_base
board = buildroot
board_level = extra
build_type = release

build_unflags =
  -lpthread             ; bionic keeps pthreads inside libc; there is no libpthread
  -lstdc++fs
  -D_FORTIFY_SOURCE=2

build_flags = ${portduino_base.build_flags_common}
  ; Our variant.h (no I2C RTC / GPS / TFT) must come BEFORE the native dir so it
  ; wins the "variant.h" lookup; the native dir stays for malloc.h / HUB75Native.h.
  -I variants/native/portduino-android
  -I variants/native/portduino
  ; libc++ 19 and later have no std::char_traits for non-char types, and
  ; MQTT.h uses basic_string<uint8_t>. Force-include a char_traits<unsigned char> shim.
  -include variants/native/portduino-android/android_compat.h
  -I ${sysenv.ANDROID_PREFIX}/include
  -L ${sysenv.ANDROID_PREFIX}/lib   ; also resolves the base env's -lyaml-cpp, -ljsoncpp and -luv
  -largp
  -li2c                 ; static build from i2c-tools; upstream adds this only in its Linux build_flags
  -lusb-1.0
  -llog
  -Os -ffunction-sections -fdata-sections
  ; GCC warns on narrowing inside {} initializers; clang makes it an error.
  ; framework-portduino's LinuxHardwareI2C.cpp (int and size_t into a __u16
  ; .len field) trips it. Downgrade to a warning.
  -Wno-c++11-narrowing
  -DPORTDUINO_ANDROID
  ; Headless: no screen renderer, input broker disabled, no GPS or I2C bus scanning
  -DHAS_SCREEN=0
  -DMESHTASTIC_EXCLUDE_SCREEN=1
  -DMESHTASTIC_EXCLUDE_I2C=1
  -DMESHTASTIC_EXCLUDE_GPS=1
  -DNO_GPS=1
  -DMESHTASTIC_EXCLUDE_INPUTBROKER=1
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -DMESHTASTIC_EXCLUDE_AUDIO=1
  -DMESHTASTIC_EXCLUDE_WEBSERVER=1
  ; Informational marker for this build. No source reads it; the fd hand-over is
  ; controlled at runtime by the PINEDIO_USB_FD_SOCKET environment variable.
  -DPINEDIO_ANDROID_FD=1

extra_scripts =
  ${env.extra_scripts}
  post:extra_scripts/android_link_flags.py

; bionic has <linux/input.h>, and Power.cpp references LinuxInput under
; #ifdef __linux__, which Android defines. LinuxInput*.cpp therefore stay in,
; unlike the macOS env.
build_src_filter = ${portduino_base.build_src_filter}
  -<graphics/Panel_sdl.cpp>
  -<graphics/TFTDisplay.cpp>

lib_ignore =
  ${portduino_base.lib_ignore}
  LovyanGFX
