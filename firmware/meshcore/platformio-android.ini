; ---------------------------------------------------------------------------
; PlatformIO configuration for the Meshdroid CH341 variant of MeshCore.
;
; Two environments share one set of hardware defines:
;
;   android-arm64   the daemon Meshdroid ships, cross-built with the NDK
;   linux-x86_64    the same code on a desktop, for testing the HAL against
;                   real hardware without an APK in the way
;
; The build scripts copy this file to variants/meshdroid_ch341/platformio.ini in
; the MeshCore checkout, where the top-level extra_configs glob
; (variants/*/platformio.ini) picks it up. PlatformIO reads one such file per
; variant directory, so both environments live here.
;
; MeshCore has no portduino_base to extend, so the platform is named directly.
; The pin is the same platform-native archive meshtasticd is built from,
; deliberately: one toolchain for both daemons means a portduino problem found
; in one is the same problem in the other.
;
; The "buildroot" board makes platform-native take its compiler, linker and
; archiver from the TARGET_* environment variables. The Android script points
; those at the NDK; the Linux script points them at the host gcc. That is the
; only difference between the two toolchains.
;
; Pinned MeshCore: companion-v1.17.1 (d9296435).
; ---------------------------------------------------------------------------

; ---------------------------------------------------------------------------
; Hardware and protocol settings, shared by both environments.
;
; Shared rather than duplicated, on purpose. SX126X_DIO2_AS_RF_SWITCH in
; particular must never differ between the two: a build without it transmits
; nothing after the first AGC reset, and a desktop test that quietly had it
; while the phone build did not would prove nothing.
; ---------------------------------------------------------------------------
[meshdroid_ch341]
build_flags =
  ; target.h lives here, and MyMesh.h includes it as <target.h>.
  -I variants/meshdroid_ch341
  -I examples/companion_radio
  ; framework-portduino defines ltoa and friends but nothing on MeshCore's
  ; include path declares them, and TxtDataHelpers.cpp calls ltoa directly.
  -include variants/meshdroid_ch341/AndroidCompat.h

  ; --- Radio classes -------------------------------------------------------
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper

  ; --- MeshToad V3 pins ----------------------------------------------------
  ; CH341 adapter indexes, not gpiochip lines. From Meshdroid's
  ; lora-usb-meshtoad-e22.yaml preset, proven under meshtasticd on this board.
  -D P_LORA_NSS=0
  -D P_LORA_RESET=2
  -D P_LORA_BUSY=4
  -D P_LORA_DIO_1=6
  ; No P_LORA_SCLK / MISO / MOSI on purpose. Ch341Hal owns the bus, so
  ; CustomSX1262::std_init() is called with a null SPIClass and its
  ; #if defined(P_LORA_SCLK) block is skipped entirely.

  ; CH341 GPIO 1 drives the E22P-915M30S front-end module's enable. Meshtastic's
  ; preset calls it RXen and drives it, and meshtasticd reaches RSSI -24 with
  ; SNR +11.5 on this board, so match that.
  -D SX126X_RXEN=1

  ; THE ONE THAT MATTERS. DIO2 drives the E22P's T/RCTRL pin, which selects the
  ; transmit path. CustomSX1262::std_init calls setDio2AsRfSwitch() under this
  ; #ifdef, and SX126xReset.h re-applies it after Calibrate(0x7F) under the same
  ; one. Without it the daemon sends its first advert, hits the first AGC reset,
  ; then transmits nothing forever while still receiving normally and reporting
  ; correct airtime. Established on hardware; see docs/openhop-radio-stack.md.
  -D SX126X_DIO2_AS_RF_SWITCH=true

  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1

  ; --- Radio parameters ----------------------------------------------------
  ; MeshCore's USA and Canada preset. Frequency, bandwidth and spreading factor
  ; must match the rest of the mesh exactly; coding rate is read from each
  ; packet's header.
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5

  ; SX1262 drive level, not radiated power. The E22P's PA needs roughly 10 to
  ; 13 dBm of drive to reach its rated 30 dBm; higher overdrives it. The board
  ; radiates about a watt either way.
  -D LORA_TX_POWER=10

  ; --- Host interface ------------------------------------------------------
  -D TCP_PORT=5000
  -D MESHCORE_TCP_INTERFACE=1

  ; Headless: no display, no buttons, no GPS.
  -D ENV_INCLUDE_GPS=0
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256

build_src_filter =
  +<../variants/meshdroid_ch341>
  +<../examples/companion_radio/*.cpp>
  +<helpers/sensors>
  ; The UI tasks are for boards with a screen.
  -<../examples/companion_radio/ui-new/>
  -<../examples/companion_radio/ui-orig/>
  -<../examples/companion_radio/ui-tiny/>

lib_deps =
  ; companion_radio needs base64, per every companion env in the tree.
  densaugeo/base64 @ ~1.4.0
  ; The CH341 driver meshtasticd already uses, at the same pin. Patch 0002 edits
  ; only libpinedio-usb.c inside this library, so Meshdroid's existing patch
  ; applies here unchanged: it receives the usbfs descriptor over an
  ; abstract-namespace socket and hands it to libusb_wrap_sys_device(). On a
  ; desktop that path stays inert, because PINEDIO_USB_FD_SOCKET is unset and
  ; libusb enumerates normally.
  https://github.com/meshtastic/libch341-spi-userspace/archive/03bf505d6e5904092c1c389c45b01098f7a302fe.zip

; ---------------------------------------------------------------------------
; The shipping daemon: arm64-v8a, bionic, no root.
; ---------------------------------------------------------------------------
[env:android-arm64]
extends = arduino_base
platform = https://github.com/meshtastic/platform-native/archive/86c62edfb7084d11669aa255411a70580e83823b.zip
board = buildroot
board_level = extra
build_type = release

build_unflags =
  -lpthread             ; bionic keeps pthreads inside libc; there is no libpthread
  -lstdc++fs
  -D_FORTIFY_SOURCE=2

build_flags = ${arduino_base.build_flags}
  ${sensor_base.build_flags}
  ${meshdroid_ch341.build_flags}
  -I ${sysenv.MESHCORE_PREFIX}/include
  -L ${sysenv.MESHCORE_PREFIX}/lib
  -largp                ; bionic has no argp; framework-portduino's Arduino.h needs it
  -li2c                 ; framework-portduino's LinuxHardwareI2C.cpp needs <i2c/smbus.h>
  -lusb-1.0
  -llog
  -Os -ffunction-sections -fdata-sections
  ; GCC warns on narrowing inside {} initializers; clang makes it an error.
  ; framework-portduino's LinuxHardwareI2C.cpp (int and size_t into a __u16
  ; .len field) trips it. Downgrade to a warning, as the meshtasticd env does.
  -Wno-c++11-narrowing
  -DPORTDUINO_PLATFORM=1
  -DPORTDUINO_ANDROID=1

extra_scripts =
  post:extra_scripts/android_link_flags.py

build_src_filter = ${arduino_base.build_src_filter}
  ${meshdroid_ch341.build_src_filter}

lib_deps = ${arduino_base.lib_deps}
  ${sensor_base.lib_deps}
  ${meshdroid_ch341.lib_deps}

; ---------------------------------------------------------------------------
; Desktop test build. Not shipped, not packaged, not installed into the APK.
;
; Exists so the CH341 HAL, the variant and the radio settings can be tested
; against real hardware without an APK, a DaemonService change or a phone in
; the loop. Same sources, same patches, same Ch341Hal, same shared defines;
; only the toolchain and the system libraries differ.
;
; No cross-compilation, so it links the distribution's libusb, libi2c and
; libuv, and glibc supplies argp. Build it with build-meshcored-linux.sh.
;
; MESH_DEBUG and MESH_PACKET_LOGGING are on here and off on Android. Every
; companion environment upstream warns against enabling them, because the debug
; output shares the serial link with the companion frame protocol and corrupts
; it. Nothing is attached to that link here, so the logging is free, and it is
; the entire point: it is how we see adverts arriving.
; ---------------------------------------------------------------------------
[env:linux-x86_64]
extends = arduino_base
platform = https://github.com/meshtastic/platform-native/archive/86c62edfb7084d11669aa255411a70580e83823b.zip
board = buildroot
board_level = extra
build_type = debug

build_flags = ${arduino_base.build_flags}
  ${sensor_base.build_flags}
  ${meshdroid_ch341.build_flags}
  -lusb-1.0
  -li2c
  -luv
  -Og -g
  -Wno-c++11-narrowing
  -DPORTDUINO_PLATFORM=1
  ; Packet-level logging, so a bare run shows what the radio hears and sends.
  -D MESH_DEBUG=1
  -D MESH_PACKET_LOGGING=1

build_src_filter = ${arduino_base.build_src_filter}
  ${meshdroid_ch341.build_src_filter}

lib_deps = ${arduino_base.lib_deps}
  ${sensor_base.lib_deps}
  ${meshdroid_ch341.lib_deps}
