; ---------------------------------------------------------------------------
; meshcored for Android: arm64-v8a, bionic, no root.
;
; build-meshcored-android.sh copies this file to
; variants/meshdroid_ch341/platformio.ini in the MeshCore checkout, alongside
; target.h and target.cpp, where the top-level extra_configs glob
; (variants/*/platformio.ini) picks it up.
;
; MeshCore has no portduino_base to extend, so this defines the platform
; directly. The pin is the same platform-native archive meshtasticd is built
; from, deliberately: one toolchain for both daemons means a portduino problem
; found in one is the same problem in the other, and the NDK settings that took
; a week to get right for meshtasticd apply unchanged.
;
; The "buildroot" board makes platform-native take its compiler, linker and
; archiver from the TARGET_* environment variables, which the build script
; points at the NDK.
;
; Pinned MeshCore: companion-v1.17.1 (d9296435).
; ---------------------------------------------------------------------------
[env:android-arm64]
extends = arduino_base
platform = https://github.com/meshtastic/platform-native/archive/86c62edfb7084d11669aa255411a70580e83823b.zip
board = buildroot
board_level = extra
build_type = release

build_unflags =
  -lpthread             ; bionic keeps pthreads inside libc; there is no libpthread
  -lstdc++fs
  -D_FORTIFY_SOURCE=2

build_flags = ${arduino_base.build_flags}
  ${sensor_base.build_flags}
  ; Our variant directory holds target.h, which MyMesh.h includes as <target.h>,
  ; so it has to be on the include path.
  -I variants/meshdroid_ch341
  ; FILESYSTEM has to be defined before IdentityStore.h's #if chain is
  ; reached, so its ESP32/RP2040/NRF52/STM32 branches all miss and ours
  ; stands. Same force-include trick as android_compat.h in the meshtasticd
  ; build. Without it every file that touches storage fails to compile.
  -include variants/meshdroid_ch341/AndroidCompat.h
  -I examples/companion_radio
  -I ${sysenv.MESHCORE_PREFIX}/include
  -L ${sysenv.MESHCORE_PREFIX}/lib
  -largp
  -li2c
  -lusb-1.0
  -llog
  -Os -ffunction-sections -fdata-sections
  ; GCC warns on narrowing inside {} initializers; clang makes it an error.
  ; framework-portduino's LinuxHardwareI2C.cpp (int and size_t into a __u16
  ; .len field) trips it. Downgrade to a warning. Same flag, same reason, as
  ; the meshtasticd android env.
  -Wno-c++11-narrowing
  -DPORTDUINO_PLATFORM=1
  -DPORTDUINO_ANDROID=1

  ; --- Radio classes -------------------------------------------------------
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper

  ; --- MeshToad V3 pins ----------------------------------------------------
  ; CH341 adapter indexes, not gpiochip lines. From Meshdroid's
  ; lora-usb-meshtoad-e22.yaml preset, proven under meshtasticd on this board.
  ; PortduinoGlue passes the same yaml values straight through to the Module,
  ; so CH341_PIN_CS in USBHal.h is an unused leftover, not the CS to use.
  -D P_LORA_NSS=0
  -D P_LORA_RESET=2
  -D P_LORA_BUSY=4
  -D P_LORA_DIO_1=6
  ; No P_LORA_SCLK / MISO / MOSI on purpose. Ch341Hal owns the bus, so
  ; CustomSX1262::std_init() is called with a null SPIClass and its
  ; #if defined(P_LORA_SCLK) block is skipped entirely.

  ; CH341 GPIO 1 drives the E22P-915M30S front-end module's enable. Meshtastic's
  ; preset calls it RXen and drives it, and meshtasticd reaches RSSI -24 with
  ; SNR +11.5 on this board, so match that. std_init turns this into
  ; setRfSwitchPins(SX126X_RXEN, RADIOLIB_NC).
  ; If transmit breaks, delete this line: the bench sweep established the board
  ; also transmits with the pin left alone.
  -D SX126X_RXEN=1

  ; THE ONE THAT MATTERS. DIO2 drives the E22P's T/RCTRL pin, which selects the
  ; transmit path. CustomSX1262::std_init calls setDio2AsRfSwitch() under this
  ; #ifdef, and SX126xReset.h re-applies it after Calibrate(0x7F) under the same
  ; one. Without it the daemon sends its first advert, hits the first AGC reset,
  ; then transmits nothing forever while still receiving normally and reporting
  ; correct airtime. Proven on hardware; see docs/openhop-radio-stack.md.
  -D SX126X_DIO2_AS_RF_SWITCH=true

  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1

  ; --- Radio parameters ----------------------------------------------------
  ; arduino_base defaults to the EU preset. Override to MeshCore's USA and
  ; Canada preset. Frequency, bandwidth and spreading factor must match the rest
  ; of the mesh exactly; coding rate is read from each packet's header.
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5

  ; SX1262 drive level, not radiated power. The E22P's PA needs roughly 10 to
  ; 13 dBm of drive to reach its rated 30 dBm; higher overdrives it. The board
  ; radiates about a watt either way. Matches SX126X_MAX_POWER in Meshdroid's
  ; meshtasticd preset for this board.
  -D LORA_TX_POWER=10

  ; --- Host interface ------------------------------------------------------
  ; Patch 0002 adds a POSIX socket BaseSerialInterface. 5000 is the port stock
  ; MeshCore clients expect, so an unmodified app finds the node with no special
  ; casing, the way 4403 works for meshtasticd today.
  -D TCP_PORT=5000
  -D MESHCORE_TCP_INTERFACE=1

  ; Headless: no display, no buttons, no GPS.
  -D ENV_INCLUDE_GPS=0
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256

extra_scripts =
  post:extra_scripts/android_link_flags.py

build_src_filter = ${arduino_base.build_src_filter}
  +<../variants/meshdroid_ch341>
  +<../examples/companion_radio/*.cpp>
  +<helpers/sensors>
  ; The UI tasks are for boards with a screen.
  -<../examples/companion_radio/ui-new/>
  -<../examples/companion_radio/ui-orig/>
  -<../examples/companion_radio/ui-tiny/>

lib_deps = ${arduino_base.lib_deps}
  ${sensor_base.lib_deps}
  ; companion_radio needs base64, per every companion env in the tree.
  densaugeo/base64 @ ~1.4.0
  ; The CH341 driver meshtasticd already uses, at the same pin. Patch 0001 edits
  ; only libpinedio-usb.c inside this library, so Meshdroid's existing patch
  ; applies here unchanged: it receives the usbfs descriptor over an
  ; abstract-namespace socket and hands it to libusb_wrap_sys_device().
  https://github.com/meshtastic/libch341-spi-userspace/archive/03bf505d6e5904092c1c389c45b01098f7a302fe.zip

